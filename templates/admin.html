<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magacin Alata - PK Praezision Technik</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eceff1; padding-bottom: 10px; margin-bottom: 20px; }
        h2 { margin: 0; color: #2c3e50; }
        .user-info { font-weight: bold; color: #2c3e50; }
        .logout-btn { background-color: #e74c3c; color: white; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; }
        .logout-btn:hover { background-color: #c0392b; }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; background: #e2e8f0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #475569; }
        .tab-btn.active { background: #3498db; color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .controls { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; align-items: center; }
        .file-upload-btn { position: relative; display: inline-block; background-color: #3498db; color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .file-upload-btn:hover { background-color: #2980b9; }
        .file-upload-btn input[type="file"] { display: none; }
        .search-box { flex: 1; min-width: 250px; }
        .search-box input { width: 100%; padding: 10px 15px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 6px; outline: none; transition: border-color 0.2s; }
        .search-box input:focus { border-color: #3498db; }
        .status-info { font-size: 14px; color: #64748b; margin-bottom: 10px; }
        .table-container { overflow-x: auto; max-height: 650px; border: 1px solid #e2e8f0; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; background: white; text-align: left; }
        th { background-color: #2c3e50; color: white; padding: 12px 15px; position: sticky; top: 0; z-index: 10; font-size: 15px; }
        td { padding: 10px 15px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        tr:nth-child(even) { background-color: #f8fafc; }
        tr:hover { background-color: #f1f5f9; }
        mark { background-color: #fef08a; color: #854d0e; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        .no-data { text-align: center; padding: 40px; color: #94a3b8; font-style: italic; }

        .badge-approved { background: #27ae60; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-pending { background: #f39c12; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .btn-approve { background: #27ae60; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-block { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h2>Magacin Alata - PK Praezision Technik</h2>
        <div>
            <span class="user-info">Korisnik: {{ current_user }}</span> &nbsp;|&nbsp;
            <a href="/logout" class="logout-btn">Odjava</a>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('searchTab', this)">Pretraga Alata</button>
        {% if is_admin %}
        <button class="tab-btn" onclick="switchTab('usersTab', this); loadUsers();">Upravljanje Korisnicima</button>
        {% endif %}
    </div>

    <!-- TAB 1: PRETRAGA ALATA -->
    <div id="searchTab" class="tab-content active">
        <div class="controls">
            <label class="file-upload-btn">
                Učitaj Excel, CSV ili PDF
                <input type="file" id="fileInput" accept=".xlsx, .xls, .csv, .pdf">
            </label>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Pretraži po nazivu, šifri ili ladici (npr. TP 438, 1-2, glodalo)..." disabled>
            </div>
        </div>

        <div class="status-info" id="statusInfo">Molimo učitajte Excel, CSV ili PDF dokument.</div>

        <div class="table-container">
            <div id="tableOutput" class="no-data">Dokument još nije učitan.</div>
        </div>
    </div>

    <!-- TAB 2: UPRAVLJANJE KORISNICIMA (SAMO ADMIN) -->
    {% if is_admin %}
    <div id="usersTab" class="tab-content">
        <h3>Popis Registriranih Korisnika</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Korisničko Ime</th>
                        <th>Status</th>
                        <th>Uloga</th>
                        <th>Akcija</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="4" class="no-data">Učitavam korisnike...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    {% endif %}
</div>

<script>
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let rawData = [];
    let headers = [];

    const fileInput = document.getElementById('fileInput');
    const searchInput = document.getElementById('searchInput');
    const tableOutput = document.getElementById('tableOutput');
    const statusInfo = document.getElementById('statusInfo');

    if (fileInput) {
        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            statusInfo.textContent = `Učitavam dokument: "${file.name}"...`;

            if (file.name.toLowerCase().endsWith('.pdf')) {
                processPDF(file);
            } else {
                processExcelOrCSV(file);
            }
        });
    }

    function processExcelOrCSV(file) {
        const reader = new FileReader();
        reader.onload = function (event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

            if (jsonData.length > 0) {
                headers = ["Ladica", "Šifra alata", "Naziv alata", "Količina"];
                
                // Izvuci točno stupce: Ladica (0), Šifra alata (1), Naziv alata (3), Količina (zadnji stupac)
                rawData = jsonData.slice(1).filter(row => row.length >= 2).map(row => {
                    let ladica = row[0] !== undefined ? row[0] : "-";
                    let sifra = row[1] !== undefined ? row[1] : "-";
                    let naziv = row[3] !== undefined ? row[3] : (row[2] !== undefined ? row[2] : "-");
                    let kolicina = row[row.length - 1] !== undefined ? row[row.length - 1] : "-";
                    
                    return [ladica, sifra, naziv, kolicina];
                });

                searchInput.disabled = false;
                searchInput.value = '';
                statusInfo.textContent = `Učitan Excel: "${file.name}" — Ukupno stavki: ${rawData.length}`;
                renderTable(rawData);
            } else {
                tableOutput.innerHTML = '<div class="no-data">Dokument je prazan.</div>';
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function processPDF(file) {
        const reader = new FileReader();
        reader.onload = function (event) {
            const typedarray = new Uint8Array(event.target.result);

            pdfjsLib.getDocument(typedarray).promise.then(async function (pdf) {
                headers = ["Ladica", "Šifra alata", "Naziv alata", "Količina"];
                rawData = [];

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const textContent = await page.getTextContent();
                    
                    let rowsMap = {};
                    textContent.items.forEach(item => {
                        let str = item.str.trim();
                        if (!str) return;

                        let rawY = Math.round(item.transform[5]);
                        let foundY = Object.keys(rowsMap).find(y => Math.abs(parseInt(y) - rawY) < 6);
                        let targetY = foundY ? foundY : rawY;

                        if (!rowsMap[targetY]) rowsMap[targetY] = [];
                        rowsMap[targetY].push({ text: str, x: item.transform[4] });
                    });

                    let sortedY = Object.keys(rowsMap).sort((a, b) => parseInt(b) - parseInt(a));

                    sortedY.forEach(y => {
                        let items = rowsMap[y].sort((a, b) => a.x - b.x);
                        
                        // Filtriramo stavke koje pripadaju retku alata prema x koordinati (stupci)
                        let ladicaItem = items.find(it => it.x < 120);
                        let sifraItem = items.find(it => it.x >= 120 && it.x < 350);
                        let nazivItem = items.find(it => it.x >= 350 && it.x < 520);
                        let kolicinaItem = items.find(it => it.x >= 520);

                        let ladica = ladicaItem ? ladicaItem.text : "";
                        let sifra = sifraItem ? sifraItem.text : "";
                        let naziv = nazivItem ? nazivItem.text : "";
                        let kolicina = kolicinaItem ? kolicinaItem.text : "";

                        // Ako nema količine u desnoj zoni, provjeri zadnji element ako je broj
                        if (!kolicina && items.length > 0) {
                            let last = items[items.length - 1];
                            if (/^\d+$/.test(last.text) && last.x > 450) {
                                kolicina = last.text;
                            }
                        }

                        // Preskoči zaglavlja i prazne redove
                        let fullLine = items.map(i => i.text).join(' ');
                        if (/STANJE IZLAZNOG|PK Praezision|Datum ispisa|Mirzad Mutapcic|Ladica\s+Sifra|Strana\s+\d+|info@pk/i.test(fullLine)) {
                            return;
                        }

                        if (sifra || naziv || ladica) {
                            rawData.push([
                                ladica || "-",
                                sifra || "-",
                                naziv || "-",
                                kolicina || "0"
                            ]);
                        }
                    });
                }

                if (rawData.length > 0) {
                    searchInput.disabled = false;
                    searchInput.value = '';
                    statusInfo.textContent = `Učitan PDF: "${file.name}" — Ukupno pronađeno stavki: ${rawData.length}`;
                    renderTable(rawData);
                } else {
                    tableOutput.innerHTML = '<div class="no-data">Nije moguće automatski izdvojiti stavke iz ovog PDF-a. Preporučujemo učitavanje Excel datoteke (.xlsx).</div>';
                }
            }).catch(function (error) {
                statusInfo.textContent = "Greška pri otvaranju PDF dokumenta.";
                tableOutput.innerHTML = '<div class="no-data">Greška pri čitanju PDF-a.</div>';
            });
        };
        reader.readAsArrayBuffer(file);
    }

    if (searchInput) {
        searchInput.addEventListener('input', function () {
            const query = this.value.trim().toLowerCase();

            if (!query) {
                renderTable(rawData);
                statusInfo.textContent = `Ukupno zapisa: ${rawData.length}`;
                return;
            }

            const filteredData = rawData.filter(row => {
                return row.some(cell => {
                    return cell !== null && cell !== undefined && cell.toString().toLowerCase().includes(query);
                });
            });

            statusInfo.textContent = `Pronađeno zapisa: ${filteredData.length} od ukupno ${rawData.length}`;
            renderTable(filteredData, query);
        });
    }

    function renderTable(data, highlightQuery = '') {
        if (data.length === 0) {
            tableOutput.innerHTML = '<div class="no-data">Nema rezultata koji odgovaraju pretrazi.</div>';
            return;
        }

        let html = '<table><thead><tr>';
        headers.forEach(header => {
            html += `<th>${header !== undefined ? header : ''}</th>`;
        });
        html += '</tr></thead><tbody>';

        data.forEach(row => {
            html += '<tr>';
            for (let i = 0; i < headers.length; i++) {
                let cellValue = row[i] !== undefined && row[i] !== null ? row[i].toString() : '';
                
                if (highlightQuery && cellValue.toLowerCase().includes(highlightQuery)) {
                    const regex = new RegExp(`(${escapeRegExp(highlightQuery)})`, 'gi');
                    cellValue = cellValue.replace(regex, '<mark>$1</mark>');
                }

                html += `<td>${cellValue}</td>`;
            }
            html += '</tr>';
        });

        html += '</tbody></table>';
        tableOutput.innerHTML = html;
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function loadUsers() {
        fetch('/api/users')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('usersTableBody');
                if (!tbody) return;
                tbody.innerHTML = '';

                data.forEach(u => {
                    let statusBadge = u.approved ? '<span class="badge-approved">Odobren</span>' : '<span class="badge-pending">Na čekanju</span>';
                    let roleStr = u.is_admin ? 'Administrator' : 'Korisnik';
                    let actionBtn = '';

                    if (!u.is_admin) {
                        actionBtn = u.approved 
                            ? `<button class="btn-block" onclick="toggleUser('${u.username}')">Blokiraj</button>` 
                            : `<button class="btn-approve" onclick="toggleUser('${u.username}')">Odobri</button>`;
                    } else {
                        actionBtn = '<em>Glavni Admin</em>';
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${u.username}</strong></td>
                            <td>${statusBadge}</td>
                            <td>${roleStr}</td>
                            <td>${actionBtn}</td>
                        </tr>
                    `;
                });
            });
    }

    function toggleUser(username) {
        fetch('/api/users/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                loadUsers();
            } else {
                alert(data.error || 'Greška pri promjeni statusa!');
            }
        });
    }
</script>

</body>
</html>
