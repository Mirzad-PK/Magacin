<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magacin Alata - PK Praezision Technik</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; background: #ffffff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .top-bar { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; border-bottom: 2px solid #eceff1; padding-bottom: 10px; margin-bottom: 15px; }
        h2 { font-size: 18px; margin: 0; color: #2c3e50; }
        .user-info { font-size: 14px; font-weight: bold; color: #2c3e50; }
        .logout-btn { background-color: #e74c3c; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 13px; }
        
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { padding: 8px 12px; background: #e2e8f0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #475569; font-size: 13px; }
        .tab-btn.active { background: #3498db; color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .file-upload-btn { display: block; text-align: center; background-color: #3498db; color: white; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; }
        .file-upload-btn input[type="file"] { display: none; }
        .search-box { width: 100%; }
        .search-box input { width: 100%; padding: 10px; font-size: 15px; border: 2px solid #cbd5e1; border-radius: 6px; outline: none; }
        
        .status-info { font-size: 13px; color: #64748b; margin-bottom: 10px; }
        
        /* Prikaz tablice prilagođen mobitelima i računarima bez suvišnog skrolovanja */
        .table-container { width: 100%; overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 6px; max-height: 650px; }
        table { width: 100%; border-collapse: collapse; background: white; text-align: left; table-layout: auto; }
        th { background-color: #2c3e50; color: white; padding: 10px; font-size: 13px; white-space: nowrap; position: sticky; top: 0; z-index: 10; }
        td { padding: 9px 10px; border-bottom: 1px solid #e2e8f0; font-size: 13px; word-break: break-word; }
        
        tr:nth-child(even) { background-color: #f8fafc; }
        tr:hover { background-color: #f1f5f9; }
        mark { background-color: #fef08a; color: #854d0e; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        .no-data { text-align: center; padding: 30px; color: #94a3b8; font-style: italic; font-size: 14px; }

        .badge-approved { background: #27ae60; color: white; padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-pending { background: #f39c12; color: white; padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .btn-approve { background: #27ae60; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-block { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }

        /* Veći ekran (Desktop) - povratak komfornijeg prikaza */
        @media (min-width: 768px) {
            body { padding: 20px; }
            .container { padding: 25px; }
            .top-bar { flex-direction: row; justify-content: space-between; align-items: center; }
            h2 { font-size: 22px; }
            .controls { flex-direction: row; align-items: center; }
            .file-upload-btn { display: inline-block; width: auto; }
            .search-box { flex: 1; width: auto; }
            th, td { padding: 10px 15px; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h2>Magacin Alata - PK Praezision Technik</h2>
        <div>
            <span class="user-info">Korisnik: {{ current_user }}</span> &nbsp;|&nbsp;
            <a href="/logout" class="logout-btn">Odjava</a>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('searchTab', this)">Pretraga Alata</button>
        {% if is_admin %}
        <button class="tab-btn" onclick="switchTab('usersTab', this); loadUsers();">Upravljanje Korisnicima</button>
        {% endif %}
    </div>

    <!-- TAB 1: PRETRAGA ALATA -->
    <div id="searchTab" class="tab-content active">
        <div class="controls">
            <label class="file-upload-btn">
                Učitaj Novi Dokument
                <input type="file" id="fileInput" accept=".xlsx, .xls, .csv, .pdf">
            </label>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Pretraži po nazivu, šifri, materijalu ili ladici..." disabled>
            </div>
        </div>

        <div class="status-info" id="statusInfo">Učitavam sačuvane podatke iz baze...</div>

        <div class="table-container">
            <div id="tableOutput" class="no-data">Učitavam lager...</div>
        </div>
    </div>

    <!-- TAB 2: UPRAVLJANJE KORISNICIMA (SAMO ADMIN) -->
    {% if is_admin %}
    <div id="usersTab" class="tab-content">
        <h3>Popis Registriranih Korisnika</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Korisničko Ime</th>
                        <th>Status</th>
                        <th>Uloga</th>
                        <th>Akcija</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="4" class="no-data">Učitavam korisnike...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    {% endif %}
</div>

<script>
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let rawData = [];
    let headers = ["Ladica", "Šifra alata", "Šifra materijala", "Naziv alata", "Količina"];

    const fileInput = document.getElementById('fileInput');
    const searchInput = document.getElementById('searchInput');
    const tableOutput = document.getElementById('tableOutput');
    const statusInfo = document.getElementById('statusInfo');

    window.addEventListener('DOMContentLoaded', function() {
        loadServerData();
    });

    function loadServerData() {
        statusInfo.textContent = "Učitavam sačuvani lager iz baze podataka...";
        fetch('/api/data')
            .then(res => res.json())
            .then(data => {
                if (data && data.rows && data.rows.length > 0) {
                    headers = data.headers && data.headers.length > 0 ? data.headers : ["Ladica", "Šifra alata", "Šifra materijala", "Naziv alata", "Količina"];
                    rawData = data.rows;
                    searchInput.disabled = false;
                    statusInfo.textContent = `Lager učitan: "${data.filename}" — Ukupno zapisa: ${rawData.length}`;
                    renderTable(rawData);
                } else {
                    statusInfo.textContent = "U bazi nema sačuvanog lagera. Učitajte novi Excel ili PDF.";
                    tableOutput.innerHTML = '<div class="no-data">Baza je prazna. Učitajte dokument sa računara.</div>';
                }
            })
            .catch(err => {
                statusInfo.textContent = "Greška pri dohvaćanju lagera iz baze.";
            });
    }

    function saveServerData(filename, currentHeaders, rows) {
        statusInfo.textContent = "Spremam lager u bazu podataka...";
        fetch('/api/data', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                filename: filename,
                headers: currentHeaders,
                rows: rows
            })
        })
        .then(res => res.json())
        .then(res => {
            if (res.success) {
                statusInfo.textContent = `Lager "${filename}" (${rows.length} zapisa) spremljen u bazu i vidljiv na svim uređajima!`;
            } else {
                statusInfo.textContent = "Greška pri spremanju u bazu: " + (res.error || "");
            }
        })
        .catch(err => {
            statusInfo.textContent = "Mrežna greška pri spremanju u bazu.";
        });
    }

    if (fileInput) {
        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            statusInfo.textContent = `Obrađujem dokument: "${file.name}"...`;

            if (file.name.toLowerCase().endsWith('.pdf')) {
                processPDF(file);
            } else {
                processExcelOrCSV(file);
            }
        });
    }

    function processExcelOrCSV(file) {
        const reader = new FileReader();
        reader.onload = function (event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

            if (jsonData.length > 0) {
                headers = ["Ladica", "Šifra alata", "Šifra materijala", "Naziv alata", "Količina"];
                
                rawData = jsonData.slice(1).filter(row => row.length >= 2).map(row => {
                    return [
                        row[0] !== undefined ? row[0] : "-",
                        row[1] !== undefined ? row[1] : "-",
                        row[2] !== undefined ? row[2] : "-",
                        row[3] !== undefined ? row[3] : "-",
                        row[4] !== undefined ? row[4] : "-"
                    ];
                });

                searchInput.disabled = false;
                searchInput.value = '';
                renderTable(rawData);
                saveServerData(file.name, headers, rawData);
            } else {
                tableOutput.innerHTML = '<div class="no-data">Dokument je prazan.</div>';
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function processPDF(file) {
        const reader = new FileReader();
        reader.onload = function (event) {
            const typedarray = new Uint8Array(event.target.result);

            pdfjsLib.getDocument(typedarray).promise.then(async function (pdf) {
                headers = ["Ladica", "Šifra alata", "Šifra materijala", "Naziv alata", "Količina"];
                rawData = [];

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const textContent = await page.getTextContent();
                    const viewport = page.getViewport({ scale: 1.0 });
                    const pageWidth = viewport.width;

                    let rowsMap = {};

                    textContent.items.forEach(item => {
                        let str = item.str.trim();
                        if (!str) return;

                        let rawY = Math.round(item.transform[5]);
                        let foundY = Object.keys(rowsMap).find(y => Math.abs(parseInt(y) - rawY) < 5);
                        let targetY = foundY ? foundY : rawY;

                        if (!rowsMap[targetY]) rowsMap[targetY] = [];
                        rowsMap[targetY].push({ text: str, x: item.transform[4] });
                    });

                    let sortedY = Object.keys(rowsMap).sort((a, b) => parseInt(b) - parseInt(a));

                    sortedY.forEach(y => {
                        let items = rowsMap[y].sort((a, b) => a.x - b.x);
                        let fullLineText = items.map(it => it.text).join(' ');

                        if (/STANJE IZLAZNOG|PK Praezision|Datum ispisa|Mirzad Mutapcic|Ladica\s+Sifra|Sifra materijala|Naziv alata\s+Kolicina|Strana\s+\d+|info@pk|www\.pk|Bosna i Hercegovina|Gradacac/i.test(fullLineText)) {
                            return;
                        }

                        let colLadica = [];
                        let colSifraAlata = [];
                        let colSifraMat = [];
                        let colNazivAlata = [];
                        let colKolicina = [];

                        items.forEach(it => {
                            let relX = it.x / pageWidth;

                            if (relX < 0.12) {
                                colLadica.push(it.text);
                            } else if (relX >= 0.12 && relX < 0.38) {
                                colSifraAlata.push(it.text);
                            } else if (relX >= 0.38 && relX < 0.62) {
                                colSifraMat.push(it.text);
                            } else if (relX >= 0.62 && relX < 0.88) {
                                colNazivAlata.push(it.text);
                            } else {
                                colKolicina.push(it.text);
                            }
                        });

                        let ladicaStr = colLadica.join(' ').trim();
                        let sifraAlataStr = colSifraAlata.join(' ').trim();
                        let sifraMatStr = colSifraMat.join(' ').trim();
                        let nazivAlataStr = colNazivAlata.join(' ').trim();
                        let kolicinaStr = colKolicina.join(' ').trim();

                        if (/^O-OP-/i.test(sifraAlataStr) && !sifraMatStr) {
                            sifraMatStr = sifraAlataStr;
                            sifraAlataStr = "";
                        }

                        if (ladicaStr || sifraAlataStr || sifraMatStr || nazivAlataStr) {
                            rawData.push([
                                ladicaStr || "-",
                                sifraAlataStr || "-",
                                sifraMatStr || "-",
                                nazivAlataStr || "-",
                                kolicinaStr || "-"
                            ]);
                        }
                    });
                }

                if (rawData.length > 0) {
                    searchInput.disabled = false;
                    searchInput.value = '';
                    renderTable(rawData);
                    saveServerData(file.name, headers, rawData);
                } else {
                    tableOutput.innerHTML = '<div class="no-data">Nije moguće automatski izdvojiti stavke iz ovog PDF-a.</div>';
                }
            }).catch(function (error) {
                statusInfo.textContent = "Greška pri otvaranju PDF dokumenta.";
                tableOutput.innerHTML = '<div class="no-data">Greška pri čitanju PDF-a.</div>';
            });
        };
        reader.readAsArrayBuffer(file);
    }

    if (searchInput) {
        searchInput.addEventListener('input', function () {
            const query = this.value.trim().toLowerCase();

            if (!query) {
                renderTable(rawData);
                statusInfo.textContent = `Ukupno zapisa: ${rawData.length}`;
                return;
            }

            const filteredData = rawData.filter(row => {
                return row.some(cell => {
                    return cell !== null && cell !== undefined && cell.toString().toLowerCase().includes(query);
                });
            });

            statusInfo.textContent = `Pronađeno zapisa: ${filteredData.length} od ukupno ${rawData.length}`;
            renderTable(filteredData, query);
        });
    }

    function renderTable(data, highlightQuery = '') {
        if (data.length === 0) {
            tableOutput.innerHTML = '<div class="no-data">Nema rezultata koji odgovaraju pretrazi.</div>';
            return;
        }

        let html = '<table><thead><tr>';
        headers.forEach(header => {
            html += `<th>${header !== undefined ? header : ''}</th>`;
        });
        html += '</tr></thead><tbody>';

        data.forEach(row => {
            html += '<tr>';
            for (let i = 0; i < headers.length; i++) {
                let cellValue = row[i] !== undefined && row[i] !== null ? row[i].toString() : '';
                
                if (highlightQuery && cellValue.toLowerCase().includes(highlightQuery)) {
                    const regex = new RegExp(`(${escapeRegExp(highlightQuery)})`, 'gi');
                    cellValue = cellValue.replace(regex, '<mark>$1</mark>');
                }

                html += `<td>${cellValue}</td>`;
            }
            html += '</tr>';
        });

        html += '</tbody></table>';
        tableOutput.innerHTML = html;
    }

    function escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function loadUsers() {
        fetch('/api/users')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('usersTableBody');
                if (!tbody) return;
                tbody.innerHTML = '';

                data.forEach(u => {
                    let statusBadge = u.approved ? '<span class="badge-approved">Odobren</span>' : '<span class="badge-pending">Na čekanju</span>';
                    let roleStr = u.is_admin ? 'Administrator' : 'Korisnik';
                    let actionBtn = '';

                    if (!u.is_admin) {
                        actionBtn = u.approved 
                            ? `<button class="btn-block" onclick="toggleUser('${u.username}')">Blokiraj</button>` 
                            : `<button class="btn-approve" onclick="toggleUser('${u.username}')">Odobri</button>`;
                    } else {
                        actionBtn = '<em>Glavni Admin</em>';
                    }

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${u.username}</strong></td>
                            <td>${statusBadge}</td>
                            <td>${roleStr}</td>
                            <td>${actionBtn}</td>
                        </tr>
                    `;
                });
            });
    }

    function toggleUser(username) {
        fetch('/api/users/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                loadUsers();
            } else {
                alert(data.error || 'Greška pri promjeni statusa!');
            }
        });
    }

    // Lagani pozadinski ping svakih 5 minuta (300.000 ms) - drži Render budnim bez opterećenja baze
    setInterval(function() {
        fetch('/ping')
            .then(res => res.json())
            .then(data => {
                console.log("Server je budan i aktivan.");
            })
            .catch(err => console.log("Ping greška:", err));
    }, 5 * 60 * 1000);
</script>

</body>
</html>
