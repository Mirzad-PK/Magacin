<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magacin Alata - PK Praezision Technik</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eceff1; padding-bottom: 10px; margin-bottom: 20px; }
        h2 { margin: 0; color: #2c3e50; }
        .user-info { font-weight: bold; color: #2c3e50; }
        .logout-btn { background-color: #e74c3c; color: white; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; }
        .logout-btn:hover { background-color: #c0392b; }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; background: #e2e8f0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #475569; }
        .tab-btn.active { background: #3498db; color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .controls { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; align-items: center; }
        .file-upload-btn { position: relative; display: inline-block; background-color: #3498db; color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .file-upload-btn:hover { background-color: #2980b9; }
        .file-upload-btn input[type="file"] { display: none; }
        .search-box { flex: 1; min-width: 250px; }
        .search-box input { width: 100%; padding: 10px 15px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 6px; outline: none; transition: border-color 0.2s; }
        .search-box input:focus { border-color: #3498db; }
        .status-info { font-size: 14px; color: #64748b; margin-bottom: 10px; }
        .table-container { overflow-x: auto; max-height: 650px; border: 1px solid #e2e8f0; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; background: white; text-align: left; }
        th { background-color: #2c3e50; color: white; padding: 12px 15px; position: sticky; top: 0; z-index: 10; font-size: 15px; }
        td { padding: 10px 15px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        tr:nth-child(even) { background-color: #f8fafc; }
        tr:hover { background-color: #f1f5f9; }
        mark { background-color: #fef08a; color: #854d0e; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        .no-data { text-align: center; padding: 40px; color: #94a3b8; font-style: italic; }

        .badge-approved { background: #27ae60; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-pending { background: #f39c12; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .btn-approve { background: #27ae60; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-block { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h2>Magacin Alata - PK Praezision Technik</h2>
        <div>
            <span class="user-info">Korisnik: {{ current_user }}</span> &nbsp;|&nbsp;
            <a href="/logout" class="logout-btn">Odjava</a>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('searchTab', this)">Pretraga Alata</button>
        {% if is_admin %}
        <button class="tab-btn" onclick="switchTab('usersTab', this); loadUsers();">Upravljanje Korisnicima</button>
        {% endif %}
    </div>

    <!-- TAB 1: PRETRAGA ALATA -->
    <div id="searchTab" class="tab-content active">
        <div class="controls">
            <label class="file-upload-btn">
                Učitaj Novi Dokument
                <input type="file" id="fileInput" accept=".xlsx, .xls, .csv, .pdf">
            </label>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Pretraži po nazivu, šifri, materijalu ili ladici..." disabled>
            </div>
        </div>

        <div class="status-info" id="statusInfo">Provjeravam sačuvani dokument iz baze...</div>

        <div class="table-container">
            <div id="tableOutput" class="no-data">Dokument se učitava iz baze...</div>
        </div>
    </div>

    <!-- TAB 2: UPRAVLJANJE KORISNICIMA (SAMO ADMIN) -->
    {% if is_admin %}
    <div id="usersTab" class="tab-content">
        <h3>Popis Registriranih Korisnika</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Korisničko Ime</th>
                        <th>Status</th>
                        <th>Uloga</th>
                        <th>Akcija</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="4" class="no-data">Učitavam korisnike...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    {% endif %}
</div>

<script>
    function switchTab(tabId, btn) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let rawData = [];
    let headers = ["Ladica", "Šifra alata", "Šifra materijala", "Naziv alata", "Količina"];

    const fileInput = document.getElementById('fileInput');
    const searchInput = document.getElementById('searchInput');
    const tableOutput = document.getElementById('tableOutput');
    const statusInfo = document.getElementById('statusInfo');

    window.addEventListener('DOMContentLoaded', function() {
        loadServerData();
    });

    function loadServerData() {
        statusInfo.textContent = "Učitavam sačuvani lager iz baze podataka...";
        fetch('/api/data')
            .then(res => res.json())
            .then(data => {
                if (data && data.rows && data.rows.length > 0) {
                    headers = data.headers && data.headers.length > 0 ? data.headers : ["Ladica", "Šifra alata", "Šifra materijala", "Naziv alata", "Količina"];
                    rawData = data.rows;
                    searchInput.disabled = false;
                    statusInfo.textContent = `Spremljeni lager sa baze: "${data.filename}" — Ukupno zapisa: ${rawData.length}`;
                    renderTable(rawData);
                } else {
                    statusInfo.textContent = "U bazi trenutno nema spremljenog lagera. Molimo učitajte Excel ili PDF.";
                    tableOutput.innerHTML = '<div class="no-data">Baza je prazna. Učitajte dokument sa računara.</div>';
                }
            })
            .catch(err => {
                statusInfo.textContent = "Greška pri dohvaćanju lagera iz baze.";
            });
    }

    function saveServerData(filename, currentHeaders, rows) {
        statusInfo.textContent = "Spremam izvučeni lager u bazu podataka za sve korisnike...";
        fetch('/api/data', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                filename: filename,
                headers: currentHeaders,
                rows: rows
            })
        })
        .then(res => res.json())
        .then(res => {
            if (res.success) {
                statusInfo.textContent = `USPJEŠNO SPREMLJENO U BAZU! Dokument "${filename}" (zapisa: ${rows.length}) sada je trajno vidljiv na svim uređajima!`;
            } else {
                statusInfo.textContent = "Greška pri spremanju u bazu podataka: " + (res.error || "");
            }
        })
        .catch(err => {
            statusInfo.textContent = "Greška u mrežnoj vezi pri spremanju u bazu.";
        });
    }

    if (fileInput) {
        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            statusInfo.textContent = `Učitavam i obrađujem dokument: "${file.name}"...`;

            if (file.name.toLowerCase().endsWith('.pdf')) {
                processPDF(file);
            } else {
                processExcelOrCSV(file);
            }
        });
    }

    function processExcelOrCSV(file) {
        const reader = new FileReader();
        reader.onload = function (event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

            if (jsonData.length > 0) {
                headers = ["Ladica", "Šifra alata", "Šifra materijala", "Naziv alata", "Količina"];
                
                rawData = jsonData.slice(1).filter(row => row.length >= 2).map(row =>
