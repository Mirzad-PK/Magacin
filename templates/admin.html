<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magacin Alata - PK Praezision Technik</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <style>
        :root {
            --primary-bg: #0f172a;
            --secondary-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #334155;
            --text-light: #64748b;
            --border-color: #e2e8f0;
            --card-bg: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Pozadina sa bočnim industrijskim vizualima i ispunjenjem do kraja */
        body { 
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), 
                        url('https://images.unsplash.com/photo-1565043589221-1a6fd9ae45c7?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            margin: 0; 
            padding: 20px; 
            color: var(--text-main); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: stretch;
        }
        
        .app-wrapper { 
            max-width: 1500px; 
            width: 100%;
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            flex: 1;
        }

        .top-navbar {
            background-color: var(--primary-bg);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-brand {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand h2 { margin: 0; font-size: 20px; letter-spacing: 0.5px; color: #f8fafc; display: flex; align-items: center; gap: 10px; }
        .nav-brand h2::before { content: ""; display: inline-block; width: 10px; height: 10px; background-color: #3b82f6; border-radius: 50%; }

        .user-panel { display: flex; align-items: center; gap: 15px; font-size: 14px; flex-wrap: wrap; }
        .user-badge { background: var(--secondary-bg); padding: 5px 12px; border-radius: 20px; border: 1px solid #334155; color: #cbd5e1; }
        .logout-btn { background-color: #ef4444; color: white; padding: 6px 14px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 13px; transition: background 0.2s; }
        .logout-btn:hover { background-color: #dc2626; }

        .nav-tabs { display: flex; gap: 8px; border-top: 1px solid #334155; padding-top: 12px; }
        .tab-btn { padding: 8px 16px; background: transparent; border: 1px solid #334155; border-radius: 6px; font-weight: 600; cursor: pointer; color: #94a3b8; font-size: 13px; transition: all 0.2s; }
        .tab-btn:hover { background: #334155; color: white; }
        .tab-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        .tab-content { display: none; }
        .tab-content.active { display: flex; flex-direction: column; flex: 1; }

        .main-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        
        .file-upload-btn { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            background-color: var(--accent-color); 
            color: white; 
            padding: 11px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 14px; 
            box-shadow: 0 2px 5px rgba(59, 130, 246, 0.3);
            transition: background 0.2s, transform 0.1s; 
        }
        .file-upload-btn:hover { background-color: var(--accent-hover); }
        .file-upload-btn input[type="file"] { display: none; }

        .search-box { width: 100%; position: relative; }
        .search-box input { 
            width: 100%; 
            padding: 12px 15px 12px 42px; 
            font-size: 15px; 
            border: 2px solid var(--border-color); 
            border-radius: 8px; 
            outline: none; 
            background: #f8fafc;
            transition: all 0.2s; 
        }
        .search-box input:focus { border-color: var(--accent-color); background: white; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
        }

        .status-info { font-size: 13px; color: var(--text-light); margin-bottom: 15px; font-weight: 500; }
