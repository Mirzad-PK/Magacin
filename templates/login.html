<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava - Magacin Alata PK Praezision Technik</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #f8fafc;
            position: relative;
            overflow: hidden;
        }

        /* Neonski plavi svjetlosni efekti u pozadini */
        body::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -20%;
            right: -20%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 0;
        }

        .login-card {
            position: relative;
            z-index: 1;
            background-color: rgba(15, 23, 42, 0.85);
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(59, 130, 246, 0.15);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            backdrop-filter: blur(12px);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #f8fafc;
            font-size: 26px;
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #93c5fd;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: rgba(30, 41, 59, 0.6);
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
            background: rgba(30, 41, 59, 0.9);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #2563eb 0%, #38bdf8 100%);
            color: white;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #0ea5e9 100%);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
            transform: translateY(-1px);
        }

        .error-msg {
            background-color: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
        }

        .success-msg {
            background-color: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #86efac;
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #94a3b8;
        }

        .register-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .register-link a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Magacin Alata</h2>
    
    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="success-msg">{{ success }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>Korisničko ime</label>
            <input type="text" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label>Šifra</label>
            <input type="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit">Prijavi se</button>
    </form>

    <div class="register-link">
        Nemaš račun? <a href="/register">Registriraj se</a>
    </div>
</div>

</body>
</html>
